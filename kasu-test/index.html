<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詔安客語基礎百句測驗</title>
<link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
<style>
:root{
  --ink:#1b2a41; --indigo:#24457a; --indigo-d:#162c52; --bg:#eef2f7; --card:#ffffff;
  --peony:#c4285f; --leaf:#2f7d4f; --line:#c9d3e2; --warn:#b3261e; --sun:#f3b63f;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;
  font-family: tauhu-oo, PingFangTC-Regular, "Microsoft JhengHei", sans-serif;}
button,input,select{font-family:inherit}
header{background:var(--indigo);color:#fff;padding:1rem 1.2rem;border-bottom:.35rem solid var(--peony)}
header h1{margin:0;font-size:1.6rem;letter-spacing:.08em}
header p{margin:0;font-size:.9rem;opacity:.85}
main{max-width:46rem;margin:0 auto;padding:1.2rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1.4rem;margin-bottom:1.2rem}
h2{margin:.2rem 0 1rem;font-size:1.5rem;color:var(--indigo-d)}
label{display:block;font-size:1.1rem;font-weight:700;margin:1rem 0 .3rem}
input,select{width:100%;font-size:1.3rem;padding:.7rem .8rem;border:2px solid var(--line);border-radius:.6rem;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.hint{font-size:.85rem;color:#52617a;margin:.2rem 0 0}
.err{color:var(--warn);font-weight:700;font-size:1rem;margin:.3rem 0 0;min-height:1.2em}
.btn{display:block;width:100%;border:0;border-radius:.8rem;padding:.9rem 1rem;font-size:1.4rem;font-weight:700;cursor:pointer;
  background:var(--indigo);color:#fff;margin-top:1.2rem}
.btn:hover{background:var(--indigo-d)}
.btn.alt{background:#fff;color:var(--indigo);border:3px solid var(--indigo)}
.btn.pink{background:var(--peony)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.role{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.role .btn{margin:0;padding:2rem 1rem;font-size:1.8rem}
.hide{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;margin-bottom:.6rem}
.prog{height:.7rem;background:var(--line);border-radius:1rem;overflow:hidden;margin-bottom:1rem}
.prog>i{display:block;height:100%;background:var(--peony);width:0;transition:width .3s}
.type{display:inline-block;background:var(--indigo);color:#fff;border-radius:2rem;padding:.1rem .9rem;font-size:.95rem}
.qtext{font-size:1.9rem;font-weight:700;margin:.8rem 0;min-height:2.4rem}
.play{background:var(--leaf);font-size:1.6rem}
.play:hover{background:#235f3c}
.opts{display:grid;gap:.8rem;margin-top:1.2rem}
.opt{display:flex;gap:.8rem;align-items:center;text-align:left;width:100%;font-size:1.7rem;padding:.9rem 1rem;border-radius:.8rem;
  border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.opt b{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.3rem}
.opt:hover{border-color:var(--indigo)}
.opt.sel{border-color:var(--peony);background:#fdeaf1}
.opt.sel b{background:var(--peony);color:#fff}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.score{font-size:3.2rem;font-weight:700;color:var(--peony);text-align:center;margin:.5rem 0}
.sum{width:100%;border-collapse:collapse;font-size:1rem}
.sum td,.sum th{border-bottom:1px solid var(--line);padding:.4rem;text-align:left}
.ok{color:var(--leaf)} .ng{color:var(--warn)}
.who{background:var(--bg);border-radius:.6rem;padding:.5rem .8rem;font-size:.95rem;margin-bottom:1rem}
/* grading */
.g-item{border:2px solid var(--line);border-radius:.8rem;padding:1rem;margin-bottom:1rem;background:#fff}
.g-item h3{margin:0 0 .3rem;font-size:1rem;color:#52617a;font-weight:400}
.g-q{font-size:1.7rem;font-weight:700;margin:.2rem 0 .6rem}
.g-play{display:inline-block;width:auto;padding:.4rem 1.2rem;font-size:1.2rem;margin:0 0 .8rem;background:var(--leaf)}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.scores button{font-size:1.6rem;font-weight:700;padding:.6rem 0;border-radius:.6rem;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.scores button.on{background:var(--peony);border-color:var(--peony);color:#fff}
.total{position:sticky;bottom:0;background:var(--indigo);color:#fff;border-radius:.8rem;padding:.6rem 1rem;font-size:1.2rem;margin-top:1rem;display:flex;justify-content:space-between}
@media(max-width:480px){html{font-size:18px}.role{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>詔安客語基礎百句測驗</h1>
  <p>聽力測驗・口說測驗</p>
</header>
<main>

<!-- 1. 選身分 -->
<section id="s-role" class="card">
  <h2>請選擇你的身分</h2>
  <div class="role">
    <button class="btn" id="roleStudent">我是學生</button>
    <button class="btn pink" id="roleTeacher">我是老師</button>
  </div>
</section>

<!-- 2a. 學生資料 -->
<section id="s-student" class="card hide">
  <h2>學生資料</h2>
  <label for="st-school">學校</label>
  <select id="st-school"></select>
  <input id="st-school-other" class="hide" placeholder="請輸入學校名稱" style="margin-top:.6rem">
  <label for="st-class">班級與座號（5 碼數字）</label>
  <input id="st-class" inputmode="numeric" maxlength="5" placeholder="例：40107">
  <p class="hint">四年甲班 7 號 → 40107（年級1碼＋班級2碼＋座號2碼）</p>
  <label for="st-id">學號</label>
  <input id="st-id" inputmode="numeric" placeholder="請輸入學號">
  <p class="err" id="st-err"></p>
  <button class="btn" id="stStart">開始聽力測驗</button>
  <button class="btn alt" data-back>回上一頁</button>
</section>

<!-- 2b. 老師資料 -->
<section id="s-teacher" class="card hide">
  <h2>老師資料</h2>
  <label for="t-school">學校</label>
  <select id="t-school"></select>
  <input id="t-school-other" class="hide" placeholder="請輸入學校名稱" style="margin-top:.6rem">
  <label for="t-name">姓名</label>
  <input id="t-name" placeholder="老師姓名" autocomplete="name">
  <label for="t-mail">信箱</label>
  <input id="t-mail" type="email" placeholder="name@example.com" autocomplete="email">
  <p class="err" id="t-err"></p>
  <button class="btn" id="tNext">下一步：填寫受測學生</button>
  <button class="btn alt" data-back>回上一頁</button>
</section>

<!-- 3b. 老師填受測學生 -->
<section id="s-tstudent" class="card hide">
  <h2>受測學生資料</h2>
  <label for="ts-school">學生學校</label>
  <select id="ts-school"></select>
  <input id="ts-school-other" class="hide" placeholder="請輸入學校名稱" style="margin-top:.6rem">
  <label for="ts-class">班級與座號（5 碼數字）</label>
  <input id="ts-class" inputmode="numeric" maxlength="5" placeholder="例：40107">
  <label for="ts-id">學號</label>
  <input id="ts-id" inputmode="numeric" placeholder="學生學號">
  <p class="err" id="ts-err"></p>
  <button class="btn" id="tsStart">開始口說測驗</button>
  <button class="btn alt" id="tsBack">回上一頁</button>
</section>

<!-- 聽力測驗 -->
<section id="s-listen" class="card hide">
  <div class="bar"><span class="type" id="l-type"></span><span id="l-count"></span></div>
  <div class="prog"><i id="l-prog"></i></div>
  <div class="qtext" id="l-text"></div>
  <button class="btn play" id="l-play">🔊 播放題目</button>
  <div class="opts" id="l-opts"></div>
  <div class="nav">
    <button class="btn alt" id="l-prev">上一題</button>
    <button class="btn" id="l-next">下一題</button>
  </div>
</section>

<!-- 聽力結果 -->
<section id="s-result" class="card hide">
  <h2>聽力測驗完成！</h2>
  <div class="score" id="r-score"></div>
  <p id="r-status" style="text-align:center;font-weight:700"></p>
  <table class="sum" id="r-table"></table>
  <button class="btn" id="r-retry">重新傳送成績</button>
  <button class="btn alt" id="r-home">回首頁</button>
</section>

<!-- 口說評分 -->
<section id="s-speak" class="card hide">
  <h2>口說測驗評分</h2>
  <div class="who" id="g-who"></div>
  <div id="g-list"></div>
  <div class="total"><span>目前總分</span><span id="g-total">0 / 50</span></div>
  <p class="err" id="g-err"></p>
  <button class="btn" id="g-submit">送出評分</button>
  <button class="btn alt" id="g-cancel">取消，回首頁</button>
</section>

<section id="s-done" class="card hide">
  <h2>評分已送出</h2>
  <p id="d-msg" style="font-size:1.2rem"></p>
  <button class="btn" id="d-next">評下一位學生</button>
  <button class="btn alt" id="d-home">回首頁</button>
</section>

</main>

<script>
/* ===== 設定區 ===== */
// 貼上 Google Apps Script「網頁應用程式」部署後的網址（結尾 /exec）
const GAS_URL = "https://script.google.com/macros/s/AKfycbyZgwh7NWuZIXTgX8Ek5hIf0gv1aJq4T3QCHaPLlTA6FRVmMXLTgE9M2s55YPz0pExzQw/exec";
// 音檔資料夾（與 index.html 同層的 audio/ 資料夾，放在 GitHub Pages）
const AUDIO_BASE = "audio/";
// 聽選正確回應題，是否在畫面顯示題目文字（false = 只聽音檔）
const SHOW_RESPONSE_TEXT = true;

const SCHOOLS = ["崙背國中","崙背國小","東興國小","陽明國小","豐榮國小","二崙國中","二崙國小","三和國小","來惠國小","光復國小"];

const LISTEN = [
 {n:1,type:"聽選正確句子",q:"(注意聽)",a:"𠊎蹛在崙背",o:["佢蹛在港尾","你蹛在虎尾","佢蹛在崙下"],f:"listen01.mp3"},
 {n:2,type:"聽選正確句子",q:"(注意聽)",a:"佢討去學校坪尞",o:["佢感覺真歡喜","佢討賞鬼抓人","𠊎討去圖書館䀴書"],f:"listen02.mp3"},
 {n:3,type:"聽選正確句子",q:"(注意聽)",a:"這滿十二點",o:["這滿係拜四","這滿請企起來","這有十五個人"],f:"listen03.mp3"},
 {n:4,type:"聽選正確句子",q:"(注意聽)",a:"𠊎食肚疾",o:["你手疾","𠊎目珠疾","佢牙疾"],f:"listen04.mp3"},
 {n:5,type:"聽選正確句子",q:"(注意聽)",a:"拜六毋使去學校",o:["今日毋係拜六","拜六愛去學校","韶日係拜六"],f:"listen05.mp3"},
 {n:6,type:"聽選正確回應",q:"遐個人係哪儕？",a:"佢係護士阿姨",o:["這係𠊎个物件","佢在健康中心","𠊎係灶下阿姨"],f:"listen06.mp3"},
 {n:7,type:"聽選正確回應",q:"你討賞球無？",a:"好啊，𠊎討",o:["好啊，請坐","無愛，𠊎食飽啊","毋係，佢在打電話"],f:"listen07.mp3"},
 {n:8,type:"聽選正確回應",q:"你昨日仰子啊？",a:"𠊎真寒，頭真疾",o:["好，𠊎會講客事","𠊎擱試䀴望","𠊎坐車來學校"],f:"listen08.mp3"},
 {n:9,type:"聽選正確回應",q:"你有紅色个筆無？",a:"有，𠊎有三支筆",o:["無，𠊎正有青色个筆","毋係，遐毋係紅色","無，佢个筆係綠豆色"],f:"listen09.mp3"},
 {n:10,type:"聽選正確回應",q:"你今年幾多歲？讀幾多年？",a:"𠊎十一歲，讀五年",o:["今日拜三，這滿兩點","𠊎在這，佢在便所","猶吂，𠊎猶吂食"],f:"listen10.mp3"}
];
// 口說：複誦題音檔 repeat01~05 對應複誦 1~5（若你的音檔編號不同，改這裡的 f）
const SPEAK = [
 {id:"複誦1",type:"複誦題",q:"今日𠊎感覺真歡喜。",f:"repeat01.mp3"},
 {id:"複誦2",type:"複誦題",q:"𠊎想討去圖書館借書。",f:"repeat02.mp3"},
 {id:"複誦3",type:"複誦題",q:"昨日拜一，韶日拜三。",f:"repeat03.mp3"},
 {id:"複誦4",type:"複誦題",q:"這係柑子色，毋係黃色。",f:"repeat04.mp3"},
 {id:"複誦5",type:"複誦題",q:"學校長和主任會講客事。",f:"repeat05.mp3"},
 {id:"問答1",type:"問答題",q:"你喊做麼个名？"},
 {id:"問答2",type:"問答題",q:"你幾多歲？讀幾年？"},
 {id:"問答3",type:"問答題",q:"你係仰子來學校个？"},
 {id:"問答4",type:"問答題",q:"五加六係幾多？"},
 {id:"問答5",type:"問答題",q:"剪刀、石頭、布，哪儕贏？"}
];

/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SECS=["s-role","s-student","s-teacher","s-tstudent","s-listen","s-result","s-speak","s-done"];
function show(id){SECS.forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
const audio=new Audio();
function play(f){audio.pause();audio.src=AUDIO_BASE+f;audio.currentTime=0;audio.play().catch(()=>alert("音檔無法播放，請確認網路或音檔檔名（"+f+"）"))}
function fillSchools(sel,other){
  sel.innerHTML='<option value="">請選擇學校</option>'+SCHOOLS.map(s=>`<option>${s}</option>`).join("")+'<option value="__other">其他（自行輸入）</option>';
  sel.onchange=()=>other.classList.toggle("hide",sel.value!=="__other");
}
const schoolVal=(sel,other)=>sel.value==="__other"?other.value.trim():sel.value;
const classOK=v=>/^\d{5}$/.test(v);
function post(payload){
  return fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
   .then(r=>r.json());
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fillSchools($("st-school"),$("st-school-other"));
fillSchools($("t-school"),$("t-school-other"));
fillSchools($("ts-school"),$("ts-school-other"));

document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show("s-role"));
$("roleStudent").onclick=()=>show("s-student");
$("roleTeacher").onclick=()=>show("s-teacher");

/* ===== 學生登入 ===== */
let student={}, quiz=[], idx=0, answers=[], pending=null;
$("stStart").onclick=()=>{
  const school=schoolVal($("st-school"),$("st-school-other")),cls=$("st-class").value.trim(),sid=$("st-id").value.trim();
  if(!school) return $("st-err").textContent="請選擇或輸入學校";
  if(!classOK(cls)) return $("st-err").textContent="班級與座號要是 5 碼數字，例如 40107，請重新輸入";
  if(!sid) return $("st-err").textContent="請輸入學號";
  $("st-err").textContent="";
  student={school,cls,sid};
  // 選項亂數；題目順序固定
  quiz=LISTEN.map(q=>({...q,opts:shuffle([q.a,...q.o])}));
  answers=new Array(quiz.length).fill(null);idx=0;
  show("s-listen");renderQ();
};
function renderQ(){
  const q=quiz[idx];
  $("l-type").textContent=q.type;
  $("l-count").textContent=`第 ${idx+1} 題 / 共 ${quiz.length} 題`;
  $("l-prog").style.width=((idx+1)/quiz.length*100)+"%";
  $("l-text").textContent=(q.type==="聽選正確回應"&&!SHOW_RESPONSE_TEXT)?"(注意聽)":q.q;
  const L=["Ａ","Ｂ","Ｃ","Ｄ"];
  $("l-opts").innerHTML=q.opts.map((t,i)=>`<button class="opt ${answers[idx]===t?"sel":""}" data-t="${esc(t)}"><b>${L[i]}</b><span>${esc(t)}</span></button>`).join("");
  $("l-opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answers[idx]=b.dataset.t;renderQ()});
  $("l-prev").style.visibility=idx?"visible":"hidden";
  $("l-next").textContent=idx===quiz.length-1?"交卷":"下一題";
  play(q.f);
}
$("l-play").onclick=()=>play(quiz[idx].f);
$("l-prev").onclick=()=>{if(idx){idx--;renderQ()}};
$("l-next").onclick=()=>{
  if(answers[idx]===null) return alert("請先選一個答案");
  if(idx<quiz.length-1){idx++;renderQ();return}
  const un=answers.map((a,i)=>a===null?i+1:0).filter(Boolean);
  if(un.length) return alert("第 "+un.join("、")+" 題還沒作答");
  if(confirm("確定要交卷嗎？")) finishListen();
};
function finishListen(){
  audio.pause();
  const detail=quiz.map((q,i)=>({n:q.n,answer:answers[i],correct:q.a,ok:answers[i]===q.a}));
  const score=detail.filter(d=>d.ok).length;
  pending={type:"listening",school:student.school,cls:student.cls,sid:student.sid,score,total:quiz.length,detail};
  $("r-score").textContent=`${score} / ${quiz.length}`;
  $("r-table").innerHTML="<tr><th>題</th><th>你的答案</th><th>結果</th></tr>"+detail.map(d=>
    `<tr><td>${d.n}</td><td>${esc(d.answer)}</td><td class="${d.ok?"ok":"ng"}">${d.ok?"✔ 答對":"✘ 正確：<br>"+esc(d.correct)}</td></tr>`).join("");
  show("s-result");sendListen();
}
function sendListen(){
  $("r-status").textContent="成績傳送中…";$("r-status").className="";$("r-retry").classList.add("hide");
  post(pending).then(r=>{
    if(!r.ok) throw new Error(r.error);
    $("r-status").textContent="✔ 成績已送出";$("r-status").className="ok";
  }).catch(()=>{
    $("r-status").textContent="✘ 成績傳送失敗，請按下方按鈕重新傳送";$("r-status").className="ng";$("r-retry").classList.remove("hide");
  });
}
$("r-retry").onclick=sendListen;
$("r-home").onclick=()=>show("s-role");

/* ===== 老師流程 ===== */
let teacher={}, tstudent={}, grades={};
$("tNext").onclick=()=>{
  const school=schoolVal($("t-school"),$("t-school-other")),name=$("t-name").value.trim(),mail=$("t-mail").value.trim();
  if(!school) return $("t-err").textContent="請選擇或輸入學校";
  if(!name) return $("t-err").textContent="請輸入姓名";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return $("t-err").textContent="信箱格式不正確";
  $("t-err").textContent="";teacher={school,name,mail};
  $("ts-school").value=SCHOOLS.includes(school)?school:"";
  show("s-tstudent");
};
$("tsBack").onclick=()=>show("s-teacher");
$("tsStart").onclick=()=>{
  const school=schoolVal($("ts-school"),$("ts-school-other")),cls=$("ts-class").value.trim(),sid=$("ts-id").value.trim();
  if(!school) return $("ts-err").textContent="請選擇或輸入學生學校";
  if(!classOK(cls)) return $("ts-err").textContent="班級與座號要是 5 碼數字，例如 40107，請重新輸入";
  if(!sid) return $("ts-err").textContent="請輸入學號";
  $("ts-err").textContent="";tstudent={school,cls,sid};grades={};
  $("g-who").innerHTML=`受測：${esc(school)}　${esc(cls)}　學號 ${esc(sid)}<br>評分教師：${esc(teacher.name)}（${esc(teacher.school)}）`;
  renderGrading();show("s-speak");
};
function renderGrading(){
  $("g-list").innerHTML=SPEAK.map((s,i)=>`
   <div class="g-item"><h3>${s.type}・${s.id}</h3>
    <div class="g-q">${esc(s.q)}</div>
    ${s.f?`<button class="btn g-play" data-f="${s.f}">🔊 播放示範音檔</button>`:""}
    <div class="scores" data-i="${i}">${[1,2,3,4,5].map(n=>`<button data-v="${n}">${n}</button>`).join("")}</div>
   </div>`).join("");
  document.querySelectorAll(".g-play").forEach(b=>b.onclick=()=>play(b.dataset.f));
  document.querySelectorAll(".scores").forEach(box=>box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    grades[SPEAK[box.dataset.i].id]=+b.dataset.v;
    box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    updTotal();
  }));
  updTotal();
}
function updTotal(){
  const t=Object.values(grades).reduce((a,b)=>a+b,0);
  $("g-total").textContent=`${t} / ${SPEAK.length*5}（已評 ${Object.keys(grades).length}/${SPEAK.length} 題）`;
}
$("g-submit").onclick=()=>{
  const miss=SPEAK.filter(s=>!(s.id in grades)).map(s=>s.id);
  if(miss.length) return $("g-err").textContent="還沒評分："+miss.join("、");
  $("g-err").textContent="";$("g-submit").disabled=true;$("g-submit").textContent="送出中…";
  const total=Object.values(grades).reduce((a,b)=>a+b,0);
  post({type:"speaking",teacher,student:tstudent,grades,total,max:SPEAK.length*5,order:SPEAK.map(s=>s.id)})
   .then(r=>{
     if(!r.ok) throw new Error(r.error);
     audio.pause();
     $("d-msg").textContent=`學號 ${tstudent.sid} 的口說總分：${total} / ${SPEAK.length*5}`;
     show("s-done");
   }).catch(()=>{$("g-err").textContent="✘ 送出失敗，請檢查網路後再按一次（評分不會消失）"})
   .finally(()=>{$("g-submit").disabled=false;$("g-submit").textContent="送出評分"});
};
$("g-cancel").onclick=()=>{if(confirm("尚未送出，確定要離開？")){audio.pause();show("s-role")}};
$("d-next").onclick=()=>{["ts-class","ts-id"].forEach(i=>$(i).value="");show("s-tstudent")};
$("d-home").onclick=()=>show("s-role");
</script>
</body>
</html>
