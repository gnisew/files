<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詔安客語基礎百句測驗</title>
<link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--muted:#6a7792;--accent:#3a7bf7;--accent-d:#2a63d8;--tint:#eaf1ff;--line:#e3e9f4;--bg:#f6f8fc;--warn:#d64545}
*{box-sizing:border-box}
html{font-size:clamp(17px,1.1vw + 12px,20px)}
body{margin:0;min-height:100dvh;color:var(--ink);line-height:1.6;display:flex;flex-direction:column;
 font-family:tauhu-oo,PingFangTC-Regular,"Microsoft JhengHei",sans-serif;
 background:radial-gradient(900px 480px at 50% -12%,#e1ebff,transparent),var(--bg)}
button,input,select{font-family:inherit;color:inherit}
.top{height:3.1rem;display:flex;align-items:center;gap:.7rem;padding:0 1rem;background:#fff;border-bottom:1px solid var(--line)}
.logo{width:1.9rem;height:1.9rem;border-radius:.6rem;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.top b{font-size:1.05rem;letter-spacing:.06em}
main{flex:1;width:100%;max-width:52rem;margin:0 auto;padding:.9rem;display:flex;flex-direction:column;justify-content:center}
.card{background:#fff;border-radius:1.5rem;padding:1.4rem;box-shadow:0 12px 40px rgba(31,42,68,.07)}
.hide{display:none!important}
h2{margin:0 0 .8rem;font-size:1.45rem}
.sub{margin:0 0 1rem;color:var(--muted)}
label{display:block;font-weight:700;margin:.7rem 0 .25rem;font-size:1rem}
input,select{width:100%;font-size:1.25rem;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.8rem;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.hint{font-size:.82rem;color:var(--muted);margin:.2rem 0 0}
.err{color:var(--warn);font-weight:700;min-height:1.4em;margin:.4rem 0 0;font-size:.95rem}
.btn{border:0;border-radius:1rem;padding:.75rem 1.2rem;font-size:1.25rem;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(58,123,247,.25);transition:background .15s,transform .12s}
.btn:hover{background:var(--accent-d)}.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible,.scores button:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{font-size:1rem;padding:.35rem .9rem}
.btn:disabled{background:#c9d8f7;box-shadow:none;cursor:not-allowed;transform:none}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:.8rem;margin-top:1rem}
.hero{text-align:center}
.hero h1{margin:.2rem 0;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:.1em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
.tile{border:2px solid var(--line);background:#fff;border-radius:1.2rem;padding:1.4rem .8rem;cursor:pointer;font-size:1.7rem;font-weight:700;transition:.15s}
.tile span{display:block;font-size:3.2rem;line-height:1.2}
.tile small{display:block;font-size:.9rem;color:var(--muted);font-weight:400}
.tile:hover{border-color:var(--accent);background:var(--tint)}
/* 題目頁（聽力、口說共用） */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.9rem}
.chip{background:var(--tint);color:var(--accent-d);border-radius:2rem;padding:.1rem .9rem;font-weight:700;font-size:1rem}
.dots{display:flex;gap:.35rem}
.dots i{width:.8rem;height:.8rem;border-radius:50%;background:var(--line)}
.dots i.done{background:#a9c6fb}.dots i.cur{background:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.qrow{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;min-height:4rem}
.play{flex:none;width:4rem;height:4rem;border-radius:50%;border:0;cursor:pointer;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 14px rgba(58,123,247,.3)}
.play:hover{background:var(--accent-d)}
.play.playing{background:var(--accent-d);animation:ring 1.1s infinite}
.play svg{display:block}
.eq{transform-box:fill-box;transform-origin:center;animation:eq .7s ease-in-out infinite alternate}
.e2{animation-delay:.2s}.e3{animation-delay:.4s}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(58,123,247,.45)}100%{box-shadow:0 0 0 1rem rgba(58,123,247,0)}}
.qtext{font-size:clamp(1.5rem,3.4vw,2rem);font-weight:700;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opt{display:flex;align-items:center;gap:.8rem;text-align:left;min-height:4.4rem;padding:.6rem 1rem;font-size:clamp(1.25rem,2.6vw,1.65rem);
 border:2px solid var(--line);border-radius:1.1rem;background:#fff;cursor:pointer;transition:.12s}
.opt b{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--tint);color:var(--accent-d);display:grid;place-items:center;font-size:1.05rem}
.opt:hover{border-color:#a9c6fb}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.sel b{background:var(--accent);color:#fff}
.av{flex:none;font-size:3rem;line-height:1}
.qrow.talk{gap:.8rem}
.qrow.talk .qtext{position:relative;flex:1;background:var(--tint);border-radius:1.3rem;padding:.5rem 1.1rem;font-size:clamp(1.4rem,3vw,1.8rem)}
.qrow.talk .qtext::before{content:"";position:absolute;left:-.55rem;top:50%;margin-top:-.45rem;border-style:solid;border-width:.45rem .55rem .45rem 0;border-color:transparent var(--tint) transparent transparent}
.qrow.talk .play{order:3;width:4rem;height:4rem}
.ansrow{display:flex;align-items:center;gap:.8rem}
.ansrow .opts{flex:1}
.intro{text-align:center;padding:2rem 1.4rem}
.i-art{font-size:4.2rem;line-height:1.2;margin:.8rem 0}
.i-text{font-size:clamp(1.6rem,3.6vw,2.1rem);font-weight:700;margin:.3rem 0 1.4rem;line-height:1.5}
.intro .btn{min-width:12rem;font-size:1.5rem}
.opt .play{width:3rem;height:3rem;box-shadow:none;margin-left:auto;margin-right:auto}
.opts.aud .opt{justify-content:flex-start;min-height:5rem}
.qnav{margin-top:1rem}
.qnav .btn{width:100%;font-size:1.4rem;padding:.7rem}
.qnav2{display:grid;grid-template-columns:1fr 2fr;gap:.8rem;margin-top:1rem}
/* 評分 */
.gwho{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin:-.3rem 0 .9rem;padding-bottom:.7rem;border-bottom:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.link{border:0;background:none;color:var(--accent-d);font-size:.95rem;font-weight:700;cursor:pointer;padding:.2rem .4rem}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.scores button{padding:.7rem 0;border:2px solid var(--line);border-radius:1.1rem;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:.12s}
.scores button:hover{border-color:#a9c6fb}
.scores b{font-size:2rem;line-height:1.3}
.scores small{font-size:.85rem;color:var(--muted);min-height:1.2em;line-height:1.2}
.scores button.on{background:var(--accent);border-color:var(--accent)}
.scores button.on b,.scores button.on small{color:#fff}
/* 完成 */
.end{text-align:center;padding:2rem 1.4rem}
.end .big{font-size:5.5rem;line-height:1.1;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.end h2{font-size:2rem;margin:.6rem 0 .2rem}
.end p{margin:.2rem 0;font-size:1.25rem;color:var(--muted)}
.stat{font-size:.9rem!important;margin-top:1rem!important}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti span{position:absolute;top:-3rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
/* 自訂視窗 */
.modal{position:fixed;inset:0;z-index:20;background:rgba(31,42,68,.4);backdrop-filter:blur(4px);display:grid;place-items:center;padding:1rem}
.mbox{background:#fff;border-radius:1.4rem;padding:1.6rem;max-width:26rem;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .25s}
.mbox p{font-size:1.3rem;margin:.2rem 0 1.2rem;font-weight:700}
.mact{display:flex;gap:.7rem}.mact .btn{flex:1}
@media(max-width:640px){
 .opts,.row2,.tiles{grid-template-columns:1fr}.opts{gap:.55rem}.opt{min-height:3.6rem}
 .tiles{gap:.7rem}.tile{padding:.9rem}.tile span{display:inline;font-size:2rem;margin-right:.5rem}
 .av{font-size:2.3rem}.ansrow,.qrow.talk{gap:.5rem}.card{padding:1rem}.actions{grid-template-columns:1fr 1fr}.dots i{width:.65rem;height:.65rem}.scores{gap:.4rem}
}
@media(prefers-reduced-motion:reduce){.confetti{display:none}*{animation:none!important}}
</style>
</head>
<body>
<div class="top"><div class="logo">客</div><b>詔安客語基礎百句測驗</b></div>
<main>

<section id="s-role" class="card hero">
  <h1>詔安客語基礎百句測驗</h1>
  <p class="sub">請選擇你的身分</p>
  <div class="tiles">
    <button class="tile" id="roleStudent"><span>🐥</span>我是學生<small>聽力測驗</small></button>
    <button class="tile" id="roleTeacher"><span>🦖</span>我是老師<small>口說測驗評分</small></button>
  </div>
</section>

<section id="s-student" class="card hide">
  <h2>學生資料</h2>
  <label for="st-school">學校</label><select id="st-school"></select>
  <input id="st-school-other" class="hide" placeholder="請輸入學校名稱" style="margin-top:.5rem">
  <div class="row2">
    <div><label for="st-class">班級座號（5碼）</label><input id="st-class" inputmode="numeric" maxlength="5" placeholder="40107"></div>
    <div><label for="st-id">學號</label><input id="st-id" inputmode="numeric" placeholder="學號"></div>
  </div>
  <p class="hint">例：四年甲班 7 號 → 40107（年級1碼＋班級2碼＋座號2碼）</p>
  <p class="err" id="st-err"></p>
  <div class="actions"><button class="btn ghost" data-back>返回</button><button class="btn" id="stStart">開始聽力測驗</button></div>
</section>

<section id="s-teacher" class="card hide">
  <h2>老師資料</h2>
  <label for="t-school">學校</label><select id="t-school"></select>
  <input id="t-school-other" class="hide" placeholder="請輸入學校名稱" style="margin-top:.5rem">
  <div class="row2">
    <div><label for="t-name">姓名</label><input id="t-name" autocomplete="name" placeholder="老師姓名"></div>
    <div><label for="t-mail">信箱</label><input id="t-mail" type="email" autocomplete="email" placeholder="name@example.com"></div>
  </div>
  <p class="err" id="t-err"></p>
  <div class="actions"><button class="btn ghost" data-back>返回</button><button class="btn" id="tNext">下一步</button></div>
</section>

<section id="s-tstudent" class="card hide">
  <h2>受測學生資料</h2>
  <label for="ts-school">學生學校</label><select id="ts-school"></select>
  <input id="ts-school-other" class="hide" placeholder="請輸入學校名稱" style="margin-top:.5rem">
  <div class="row2">
    <div><label for="ts-class">班級座號（5碼）</label><input id="ts-class" inputmode="numeric" maxlength="5" placeholder="40107"></div>
    <div><label for="ts-id">學號</label><input id="ts-id" inputmode="numeric" placeholder="學號"></div>
  </div>
  <p class="err" id="ts-err"></p>
  <div class="actions"><button class="btn ghost" id="tsBack">返回</button><button class="btn" id="tsStart">開始口說評分</button></div>
</section>

<section id="s-intro" class="card intro hide">
  <span class="chip" id="i-type"></span>
  <div class="i-art" id="i-art"></div>
  <p class="i-text" id="i-text"></p>
  <button class="btn" id="i-ok">知道了</button>
</section>

<section id="s-listen" class="card hide">
  <div class="qhead"><span class="chip" id="l-type"></span><div class="dots" id="l-dots"></div></div>
  <div class="qrow" id="l-row">
    <span class="av hide" id="l-av1">👦</span>
    <button class="play" id="l-play" aria-label="播放題目"></button>
    <div class="qtext" id="l-text"></div>
  </div>
  <div class="ansrow">
    <span class="av hide" id="l-av2">👧</span>
    <div class="opts" id="l-opts"></div>
  </div>
  <div class="qnav"><button class="btn" id="l-ok" disabled>確定</button></div>
</section>

<section id="s-result" class="card end hide">
  <div class="big" id="r-emoji">🎆</div>
  <h2>全部作答完成！</h2>
  <p>你好棒，謝謝你認真作答 🎉</p>
  <p class="stat" id="r-status"></p>
  <div class="actions" style="grid-template-columns:1fr;max-width:18rem;margin:1rem auto 0">
    <button class="btn" id="r-retry">重新傳送</button>
    <button class="btn ghost" id="r-home">回首頁</button>
  </div>
</section>

<section id="s-speak" class="card hide">
  <div class="gwho"><span id="g-who"></span><button class="link" id="g-cancel">離開</button></div>
  <div class="qhead"><span class="chip" id="g-type"></span><div class="dots" id="g-dots"></div></div>
  <div class="qrow"><button class="play" id="g-play" aria-label="播放音檔"></button><div class="qtext" id="g-q"></div></div>
  <div class="scores" id="g-scores"></div>
  <p class="err" id="g-err"></p>
  <div class="qnav2"><button class="btn ghost" id="g-prev">上一題</button><button class="btn" id="g-next" disabled>下一題</button></div>
</section>

<section id="s-done" class="card end hide">
  <div class="big">✅</div>
  <h2>評分已送出</h2>
  <p id="d-msg"></p>
  <div class="actions" style="grid-template-columns:1fr;max-width:18rem;margin:1rem auto 0">
    <button class="btn" id="d-next">評下一位學生</button>
    <button class="btn ghost" id="d-home">回首頁</button>
  </div>
</section>
</main>

<div class="modal hide" id="modal" role="dialog" aria-modal="true">
  <div class="mbox"><p id="m-msg"></p>
    <div class="mact"><button class="btn ghost" id="m-cancel"></button><button class="btn" id="m-ok"></button></div></div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ===== 設定區 ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyZgwh7NWuZIXTgX8Ek5hIf0gv1aJq4T3QCHaPLlTA6FRVmMXLTgE9M2s55YPz0pExzQw/exec"; // Apps Script 部署網址（/exec 結尾）
const AUDIO_BASE = "audio/";          // 音檔資料夾
const SCHOOLS = ["崙背國中","崙背國小","東興國小","陽明國小","豐榮國小","二崙國中","二崙國小","三和國小","來惠國小","光復國小"];

// 聽選正確句子：f=題目音檔，a=正確答案文字，o=其他三個選項文字
// 聽選正確回應：f=題目音檔，af=四個選項音檔（第 1 個為正確答案），畫面不顯示任何文字
const AF=n=>[1,2,3,4].map(i=>`listen${String(n).padStart(2,"0")}-${i}.mp3`);
const LISTEN = [
 {n:1,type:"聽選正確句子",f:"listen01.mp3",a:"我住在崙背",o:["他住在港尾","你住在虎尾","他住在崙前"]},
 {n:2,type:"聽選正確句子",f:"listen02.mp3",a:"他要去操場玩",o:["他覺得很高興","他要玩鬼抓人","我要去圖書館"]},
 {n:3,type:"聽選正確句子",f:"listen03.mp3",a:"現在十二點",o:["目前是星期四","現在請站起來","這裡有十五個人"]},
 {n:4,type:"聽選正確句子",f:"listen04.mp3",a:"我肚子痛",o:["你手在痛","我眼睛痛","他牙齒痛"]},
 {n:5,type:"聽選正確句子",f:"listen05.mp3",a:"星期六不必去學校",o:["今天不是星期六","星期六要去學校","明天是星期六"]},
 {n:6,type:"聽選正確回應",f:"listen06.mp3",af:AF(6)},
 {n:7,type:"聽選正確回應",f:"listen07.mp3",af:AF(7)},
 {n:8,type:"聽選正確回應",f:"listen08.mp3",af:AF(8)},
 {n:9,type:"聽選正確回應",f:"listen09.mp3",af:AF(9)},
 {n:10,type:"聽選正確回應",f:"listen10.mp3",af:AF(10)}
];
const SPEAK = [
 {id:"複誦1",type:"複誦題",q:"今日𠊎感覺真歡喜。",f:"repeat01.mp3"},
 {id:"複誦2",type:"複誦題",q:"𠊎想討去圖書館借書。",f:"repeat02.mp3"},
 {id:"複誦3",type:"複誦題",q:"昨日拜一，韶日拜三。",f:"repeat03.mp3"},
 {id:"複誦4",type:"複誦題",q:"這係柑子色，毋係黃色。",f:"repeat04.mp3"},
 {id:"複誦5",type:"複誦題",q:"學校長和主任會講客事。",f:"repeat05.mp3"},
 {id:"問答1",type:"問答題",q:"你喊做麼个名？"},
 {id:"問答2",type:"問答題",q:"你幾多歲？讀幾年？"},
 {id:"問答3",type:"問答題",q:"你係仰子來學校个？"},
 {id:"問答4",type:"問答題",q:"五加六係幾多？"},
 {id:"問答5",type:"問答題",q:"剪刀、石頭、布，哪儕贏？"}
];
const INTRO={
 "聽選正確句子":{art:"🔊 ＝ 📝",text:"選跟音檔一樣的句子。"},
 "聽選正確回應":{art:"👦💬 ➜ 👧💬",text:"音檔是別人說的話，請選出適當回應的音檔。"}
};
const SCORE_LABEL={3:"尚可",5:"優"};
const ICON_IDLE='<svg viewBox="0 0 24 24" width="55%" height="55%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" width="55%" height="55%" fill="#fff"><rect class="eq" x="4" y="5" width="3.5" height="14" rx="1.75"/><rect class="eq e2" x="10.25" y="5" width="3.5" height="14" rx="1.75"/><rect class="eq e3" x="16.5" y="5" width="3.5" height="14" rx="1.75"/></svg>';


/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SECS=["s-role","s-student","s-teacher","s-tstudent","s-intro","s-listen","s-result","s-speak","s-done"];
function show(id){SECS.forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
const audio=new Audio();
let curBtn=null,seq=0,gapTimer=null,left=0;
function stopUI(){clearTimeout(gapTimer);left=0;if(curBtn){curBtn.classList.remove("playing");curBtn.innerHTML=ICON_IDLE;curBtn=null}}
audio.onplaying=()=>{if(curBtn){curBtn.classList.add("playing");curBtn.innerHTML=ICON_PLAY}};
audio.onerror=stopUI;
audio.onpause=()=>{if(audio.paused&&!audio.ended)stopUI()};
// 播完若還有剩餘次數，間隔 0.5 秒再播
audio.onended=()=>{
  if(left>0){left--;const my=seq;
    gapTimer=setTimeout(()=>{if(my===seq){audio.currentTime=0;audio.play().catch(stopUI)}},500)}
  else stopUI();
};
// play(檔名, 按鈕, 播放次數)
function play(f,btn,times=1){
  stopUI();audio.pause();seq++;curBtn=btn||null;left=times-1;
  audio.src=AUDIO_BASE+f;audio.currentTime=0;
  audio.play().catch(()=>{stopUI();dlg("音檔無法播放，請檢查網路或請老師協助（"+f+"）")});
}
// 自訂視窗：dlg("訊息") 只有「好」；dlg("訊息","確定","取消") 有兩個按鈕，回傳 true/false
function dlg(msg,ok="好",cancel=null){return new Promise(res=>{
  $("m-msg").textContent=msg;$("m-ok").textContent=ok;
  $("m-cancel").classList.toggle("hide",!cancel);if(cancel)$("m-cancel").textContent=cancel;
  $("modal").classList.remove("hide");$("m-ok").focus();
  const done=v=>{$("modal").classList.add("hide");document.onkeydown=null;res(v)};
  $("m-ok").onclick=()=>done(true);$("m-cancel").onclick=()=>done(false);
  document.onkeydown=e=>{if(e.key==="Escape")done(false)};
})}
function fillSchools(sel,other){
  sel.innerHTML='<option value="">請選擇學校</option>'+SCHOOLS.map(s=>`<option>${s}</option>`).join("")+'<option value="__other">其他（自行輸入）</option>';
  sel.onchange=()=>other.classList.toggle("hide",sel.value!=="__other");
}
const schoolVal=(s,o)=>s.value==="__other"?o.value.trim():s.value;
const classOK=v=>/^\d{5}$/.test(v);
const post=p=>fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(r=>r.json());
[["st"],["t"],["ts"]].forEach(([p])=>fillSchools($(p+"-school"),$(p+"-school-other")));
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show("s-role"));
$("roleStudent").onclick=()=>show("s-student");
$("roleTeacher").onclick=()=>show("s-teacher");

/* ===== 學生：聽力 ===== */
let student={},quiz=[],idx=0,answers=[],pending=null,lock=false;
$("stStart").onclick=()=>{
  const school=schoolVal($("st-school"),$("st-school-other")),cls=$("st-class").value.trim(),sid=$("st-id").value.trim();
  if(!school) return $("st-err").textContent="請選擇或輸入學校";
  if(!classOK(cls)) return $("st-err").textContent="班級座號要是 5 碼數字（例如 40107），請重新輸入";
  if(!sid) return $("st-err").textContent="請輸入學號";
  $("st-err").textContent="";student={school,cls,sid};
  quiz=LISTEN.map(q=>{
    const opts=q.af?q.af.map(f=>({k:f,f})):[q.a,...q.o].map(t=>({k:t,t}));
    return {...q,correct:q.af?q.af[0]:q.a,opts:shuffle(opts)};
  });
  answers=quiz.map(()=>null);idx=0;lock=false;goQ();
};
function renderOpts(){
  const L=["A","B","C","D"],q=quiz[idx],aud=!!q.af;
  $("l-opts").classList.toggle("aud",aud);
  $("l-opts").innerHTML=q.opts.map((o,i)=>`<button class="opt ${answers[idx]===o.k?"sel":""}" data-i="${i}"><b>${L[i]}</b>${aud?`<span class="play" aria-hidden="true">${ICON_IDLE}</span>`:`<span>${esc(o.t)}</span>`}</button>`).join("");
  $("l-opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(lock)return;
    const o=q.opts[b.dataset.i];
    answers[idx]=o.k;renderOpts();
    // 音檔選項：點到就選取並播放該音檔
    if(aud) play(o.f,$("l-opts").children[b.dataset.i].querySelector(".play"));
  });
  $("l-dots").innerHTML=quiz.map((_,i)=>`<i class="${i===idx?"cur":i<idx?"done":""}"></i>`).join("");
  $("l-ok").disabled=answers[idx]===null;
  $("l-ok").textContent=idx===quiz.length-1?"完成 ✔":"確定";
}
// 換題型時，先顯示說明畫面
function goQ(){
  audio.pause();stopUI();
  const q=quiz[idx];
  if(idx===0||quiz[idx-1].type!==q.type){
    $("i-type").textContent=q.type;$("i-art").textContent=INTRO[q.type].art;$("i-text").textContent=INTRO[q.type].text;
    show("s-intro");
  } else {show("s-listen");renderQ()}
}
$("i-ok").onclick=()=>{show("s-listen");renderQ()};
function renderQ(){
  const q=quiz[idx];
  $("l-type").textContent=`第 ${idx+1} 題・${q.type}`;
  const talk=!!q.af;
  $("l-text").textContent="(注意聽)";
  $("l-text").classList.toggle("hide",talk);
  $("l-row").classList.toggle("talk",talk);
  $("l-av1").classList.toggle("hide",!talk);$("l-av2").classList.toggle("hide",!talk);
  renderOpts();play(q.f,$("l-play"));
}
$("l-ok").onclick=()=>{
  if(lock||answers[idx]===null) return;
  lock=true;
  if(idx<quiz.length-1){idx++;lock=false;goQ()} else {lock=false;finishListen()}
};
$("l-play").onclick=()=>play(quiz[idx].f,$("l-play"));

function finishListen(){
  audio.pause();stopUI();
  const detail=quiz.map((q,i)=>({n:q.n,answer:answers[i],correct:q.correct,ok:answers[i]===q.correct}));
  pending={type:"listening",school:student.school,cls:student.cls,sid:student.sid,score:detail.filter(d=>d.ok).length,total:quiz.length,detail};
  const faces=["🎆","🥳","🤩","😻","🐯","🦄","🐣"];
  $("r-emoji").textContent=faces[Math.floor(Math.random()*faces.length)];
  show("s-result");burst();sendListen();
}
function sendListen(){
  $("r-status").textContent="資料傳送中…";$("r-retry").classList.add("hide");
  post(pending).then(r=>{if(!r.ok)throw 0;$("r-status").textContent="✔ 已完成登錄"})
  .catch(()=>{$("r-status").textContent="傳送失敗，請按「重新傳送」或請老師協助";$("r-retry").classList.remove("hide")});
}
$("r-retry").onclick=sendListen;
$("r-home").onclick=()=>show("s-role");
function burst(){
  const em=["🎉","🎆","✨","🎊","⭐","🌟","🥳","🎈"],box=$("confetti");box.innerHTML="";
  for(let i=0;i<40;i++){const s=document.createElement("span");s.textContent=em[i%em.length];
    s.style.cssText=`left:${Math.random()*96}vw;font-size:${1.3+Math.random()*1.6}rem;animation-delay:${Math.random()*1.4}s;animation-duration:${2.6+Math.random()*2}s`;
    box.appendChild(s)}
  setTimeout(()=>box.innerHTML="",6500);
}

/* ===== 老師：口說評分（一題一頁）===== */
let teacher={},tstudent={},grades={},gi=0;
document.querySelectorAll(".play").forEach(b=>b.innerHTML=ICON_IDLE);
$("tNext").onclick=()=>{
  const school=schoolVal($("t-school"),$("t-school-other")),name=$("t-name").value.trim(),mail=$("t-mail").value.trim();
  if(!school) return $("t-err").textContent="請選擇或輸入學校";
  if(!name) return $("t-err").textContent="請輸入姓名";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return $("t-err").textContent="信箱格式不正確";
  $("t-err").textContent="";teacher={school,name,mail};
  $("ts-school").value=SCHOOLS.includes(school)?school:"";show("s-tstudent");
};
$("tsBack").onclick=()=>show("s-teacher");
$("tsStart").onclick=()=>{
  const school=schoolVal($("ts-school"),$("ts-school-other")),cls=$("ts-class").value.trim(),sid=$("ts-id").value.trim();
  if(!school) return $("ts-err").textContent="請選擇或輸入學生學校";
  if(!classOK(cls)) return $("ts-err").textContent="班級座號要是 5 碼數字（例如 40107），請重新輸入";
  if(!sid) return $("ts-err").textContent="請輸入學號";
  $("ts-err").textContent="";tstudent={school,cls,sid};grades={};gi=0;
  $("g-who").textContent=`${school}　${cls}　學號 ${sid}　｜　評分教師：${teacher.name}`;
  show("s-speak");enterG();
};
function renderG(){
  const s=SPEAK[gi],last=gi===SPEAK.length-1;
  $("g-type").textContent=`${s.id}・${s.type}`;
  $("g-q").textContent=s.q;
  $("g-play").classList.toggle("hide",!s.f);
  $("g-dots").innerHTML=SPEAK.map((_,i)=>`<i class="${i===gi?"cur":i<gi?"done":""}"></i>`).join("");
  $("g-scores").innerHTML=[1,2,3,4,5].map(n=>`<button data-v="${n}" class="${grades[s.id]===n?"on":""}"><b>${n}</b><small>${SCORE_LABEL[n]||""}</small></button>`).join("");
  $("g-scores").querySelectorAll("button").forEach(b=>b.onclick=()=>{grades[s.id]=+b.dataset.v;renderG()});
  $("g-prev").style.visibility=gi?"visible":"hidden";
  $("g-next").disabled=!(s.id in grades);
  $("g-next").textContent=last?"送出評分":"下一題";
}
function gStop(){audio.pause();stopUI()}
// 進入題目：複誦題自動播放 2 次（間隔 0.5 秒）
function enterG(){renderG();const s=SPEAK[gi];if(s.f)play(s.f,$("g-play"),2)}
$("g-play").onclick=()=>play(SPEAK[gi].f,$("g-play"),2);
$("g-prev").onclick=()=>{if(gi){gStop();gi--;enterG()}};
$("g-next").onclick=()=>{
  if(!(SPEAK[gi].id in grades)) return;
  gStop();
  if(gi<SPEAK.length-1){gi++;enterG();return}
  submitG();
};
function submitG(){
  $("g-err").textContent="";$("g-next").disabled=true;$("g-next").textContent="送出中…";
  const total=Object.values(grades).reduce((a,b)=>a+b,0);
  post({type:"speaking",teacher,student:tstudent,grades,total,max:SPEAK.length*5,order:SPEAK.map(s=>s.id)})
   .then(r=>{if(!r.ok)throw 0;$("d-msg").textContent=`學號 ${tstudent.sid} 口說總分：${total} / ${SPEAK.length*5}`;show("s-done")})
   .catch(()=>{$("g-err").textContent="送出失敗，請檢查網路後再按一次（評分不會消失）";$("g-next").disabled=false;$("g-next").textContent="送出評分"});
}
$("g-cancel").onclick=async()=>{if(await dlg("評分還沒送出，確定要離開嗎？","離開","繼續評分")){gStop();show("s-role")}};
$("d-next").onclick=()=>{$("ts-class").value="";$("ts-id").value="";show("s-tstudent")};
$("d-home").onclick=()=>show("s-role");
</script>
</body>
</html>
